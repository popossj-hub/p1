<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Management System</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <h1>Network Management System</h1>
                <div class="connection-status">
                    <span class="status-indicator" id="connectionStatus"></span>
                    <span id="connectionText">Connecting...</span>
                </div>
            </div>
            <nav>
                <button class="nav-btn active" data-tab="dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Dashboard
                </button>
                <button class="nav-btn" data-tab="ipam">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    IPAM
                </button>
            </nav>
        </header>

        <main>
            <div id="dashboard" class="tab-content active">
                <div class="section-header">
                    <h2>Switch Status Monitor</h2>
                    <div class="last-update">
                        Last updated: <span id="lastUpdate">--</span>
                    </div>
                </div>
                <div class="switches-grid" id="switchesGrid">
                    <div class="loading">Loading switches...</div>
                </div>
            </div>

            <div id="ipam" class="tab-content">
                <div class="section-header">
                    <h2>IP Address Management</h2>
                    <div class="vlan-filter">
                        <label for="vlanSelect">Filter by VLAN:</label>
                        <select id="vlanSelect">
                            <option value="">All VLANs</option>
                        </select>
                    </div>
                </div>
                <div class="ipam-container" id="ipamContainer">
                    <div class="loading">Loading IP allocations...</div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Network Management System | Monitoring 4 switches across 5 VLANs</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
